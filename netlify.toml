# Netlify builds the hub from main with the Next.js runtime (server routes, proxy, server actions).
[build]
  command = "pnpm build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # NEXT_PUBLIC_* values are public by design and get inlined into the browser bundle;
  # they are marked secret in the Netlify UI, so the secrets scanner must skip them.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY"
